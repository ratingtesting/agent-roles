<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CJM — три ветки buyer: ипотека, без посредников, выбор объекта</title><style>
*{box-sizing:border-box}
body{margin:0;background:#0d1014;color:#e6e9ee;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
.hd{background:#141920;border-bottom:1px solid #232a34;padding:15px 20px}
h1{margin:0 0 5px;font-size:18px}.sub{color:#8b95a5;font-size:12.5px;max-width:1000px}
.wrap{max-width:1240px;margin:16px auto;padding:0 18px 50px}
.jt{background:#12211a;border:1px solid #2f8f5b;border-radius:10px;padding:11px 15px;font-size:13px}
.jt b{color:#d1fae5}
.nd{background:#11161c;border:1px solid #232a34;border-radius:11px;padding:13px 16px;margin-top:13px}
.nd h3{margin:0 0 11px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:#6f7885}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(366px,1fr));gap:11px}
.c{background:#161c24;border:1px solid #2e3746;border-radius:10px;overflow:hidden}
.c{border-left-width:4px}
.c.s1{border-left-color:#7dd3fc}
.c.s2{border-left-color:#0ea5e9}
.c.s3{border-left-color:#3b82f6}
.c.s4{border-left-color:#d4a017}
.c.mid{border-left-color:#2f8f5b}
.c.trunk{border-left-color:#d4a017}
.h2c{padding:8px 12px;border-bottom:1px solid #2e3746;background:#141b23;
 display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sg{font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:4px}
.sg.s1{background:#164e63;color:#cffafe}
.sg.s2{background:#075985;color:#e0f2fe}
.sg.s3{background:#1e40af;color:#dbeafe}
.sg.s4{background:#92400e;color:#fde68a}
.rl{font-size:11.5px;color:#8b95a5}.mt2{font-size:10px;color:#6f7885}
.bd{padding:4px 12px 11px}
.ph{font-size:14.5px;font-weight:600;color:#fff;line-height:1.3;padding:9px 0 4px}
.st{font-size:10.5px;color:#8b95a5;padding:0 0 6px;font-style:italic}
.f{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:5px 0;font-size:11.5px;border-bottom:1px dashed #232a34}
.f:last-child{border-bottom:0}
.f .k{color:#6f7885;font-size:9.5px;text-transform:uppercase;padding-top:2px}
.f .v{color:#c6cdd8}
.f.th .v{color:#93c5fd}.f.em .v{color:#fcd34d}.f.ob .v{color:#f0abfc}
.f.ba .v{color:#fb923c}.f.pa .v{color:#fca5a5}.f.in .v{color:#7dd3fc}
.f.an{background:#12211a;margin:8px -12px 0;padding:9px 12px;border-top:1px solid #2f8f5b;border-radius:0}
.f.an .k{color:#6ee7b7}.f.an .v{color:#a7f3d0;font-size:12px}
.f.tl{background:#1a1d24;margin:0 -12px;padding:8px 12px;border-top:1px solid #2e3746;border-radius:0}
.f.tl .k{color:#a78bfa}.f.tl .v{color:#c4b5fd;font-size:11px;font-style:italic}
/* ВЕРТИКАЛЬНАЯ ВЕТКА */
.path{max-width:760px;margin:0 auto}
.vc{position:relative;padding:0 22px}
.vc::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(#2f8f5b,#2e3746)}
.vn{position:relative;background:#161c24;border:1px solid #2e3746;border-radius:10px;
 padding:11px 14px;margin:14px 0}
.vn::before{content:'';position:absolute;left:-18px;top:17px;width:11px;height:11px;
 border-radius:50%;background:#0d1014;border:2px solid #5eead4}
.vn.t{border-color:#d4a017}.vn.t::before{border-color:#fbbf24}
.vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.vn .ph{font-size:15.5px;padding:0}
.vn .st{padding:0 0 7px}
.vf{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:4px 0;font-size:11.5px;border-bottom:1px dashed #232a34}
.vf:last-child{border-bottom:0}
.vf .k{color:#6f7885;font-size:9.5px;text-transform:uppercase;padding-top:2px}
.vf .v{color:#c6cdd8}
.vf.ob .v{color:#f0abfc}.f.ob .v{color:#f0abfc}.f.tl .v,.vf.tl .v{color:#c4b5fd;font-size:11px;font-style:italic}
.lk{font-size:11.5px;color:#8b95a5;text-align:center;padding:2px 0 0}
.lk b{color:#8fe3b0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.fk{border:1px solid #2f8f5b;background:#12211a;border-radius:8px;padding:11px;text-align:center;font-size:12.5px}
.fk.r{border:1px dashed #4b5563;background:#171a1f}
.fk b{display:block;margin-bottom:3px}.fk span{font-size:10px;color:#7d8797}
.note{background:#11161c;border:1px solid #232a34;border-radius:10px;padding:13px 16px;margin-top:16px}
.note h3{margin:0 0 9px;font-size:13px;color:#fde68a}
.note p{margin:0 0 6px;font-size:12px;color:#aeb6c2}.note p:last-child{margin:0}
.note code{background:#1c232c;padding:1px 4px;border-radius:3px;color:#8fe3b0;font-size:11px}

.rec{background:#11161c;border:1px solid #232a34;border-radius:11px;padding:14px 16px;margin-top:18px}
.rec h3{margin:0 0 10px;font-size:13px;color:#fde68a}
.rhdr,.rr{display:grid;grid-template-columns:230px 118px 108px 1fr;gap:11px;align-items:start}
.rhdr{padding:5px 9px;background:#141b23;border-radius:6px;margin-bottom:5px;font-size:9.5px;
 text-transform:uppercase;letter-spacing:.4px;color:#6f7885}
.rr{padding:9px;border-bottom:1px solid #1e252e;align-items:start}
.rq{font-size:11.5px;color:#e6e9ee;line-height:1.3}.rq span{font-size:10px;color:#6f7885}
.rd{font-size:11px;color:#8b95a5}
.vd{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-align:center}
.vd.keep{background:#4a1d1d;color:#fca5a5}
.vd.opt{background:#4a3d1a;color:#fcd34d}
.why{font-size:11.5px;color:#aeb6c2;line-height:1.45}
.why b{color:#8fe3b0}
.rp{font-size:12px;color:#aeb6c2;margin:0 0 7px;line-height:1.45}
.rp b{color:#8fe3b0}.rp code{background:#1c232c;padding:1px 4px;border-radius:3px;color:#c4b5fd;font-size:11px}
@media(max-width:820px){.rhdr,.rr{grid-template-columns:1fr}}
.mb{background:#161c24;border:1px solid #2e3746;border-left:3px solid #d4a017;border-radius:8px;padding:9px 11px}.mb b{display:block;font-size:17px;color:#fde68a}.mb span{display:block;font-size:11px;color:#aeb6c2;margin:2px 0}.mb i{font-size:10px;color:#6f7885;font-style:normal}

/* ЦВЕТОВЫЕ РАЗМЕТКИ ВНУТРИ КАРТОЧКИ (правило §3.0c) — для обоих префиксов .f и .vf */
.f.th .v,.vf.th .v{color:#93c5fd}   /* мысль — голубой */
.f.em .v,.vf.em .v{color:#fcd34d}   /* эмоция — жёлтый */
.f.ob .v,.vf.ob .v{color:#f0abfc}   /* возражение — фиолетовый */
.f.ba .v,.vf.ba .v{color:#fb923c}   /* барьер — оранжевый */
.f.pa .v,.vf.pa .v{color:#fca5a5}   /* боль — красный */
.f.in .v,.vf.in .v{color:#7dd3fc}   /* что ищет — лазурный */
.f.an .v,.vf.an .v{color:#a7f3d0}   /* о чём статья — зелёный */
.f.tl .v,.vf.tl .v{color:#c4b5fd;font-size:11px;font-style:italic} /* хвост — сиреневый курсив */
.f .k,.vf .k{color:#6f7885}
.f.th .k,.vf.th .k{color:#60a5fa}
.f.em .k,.vf.em .k{color:#d97706}
.f.ob .k,.vf.ob .k{color:#c084fc}
.f.ba .k,.vf.ba .k{color:#ea580c}
.f.pa .k,.vf.pa .k{color:#dc2626}
.f.in .k,.vf.in .k{color:#0891b2}
.lk.first{margin-top:0;padding-top:0}
.lk b{color:#8fe3b0}
</style></head><body>
<div class="hd"><h1>CJM — карта веток</h1>
<div class="sub">Стадии — по канону: TOFU = Awareness · MOFU = Consideration + Evaluation · BOFU = Decision.
Retention в карте не используется: это стадия после покупки.</div></div>
<!--CJM_BRANCHES_HERE-->
<script>
function E(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){
 return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];})}
var ALL=window.CJM_DATA;
function rows(x){
 return '<div class="vf th"><div class="k">мысль</div><div class="v">'+E(x.thought)+'</div></div>'
 +'<div class="vf em"><div class="k">эмоция</div><div class="v">'+E(x.emotion)+'</div></div>'
 +'<div class="vf ob"><div class="k">возражение</div><div class="v">'+E(x.objection)+'</div></div>'
 +'<div class="vf ba"><div class="k">барьер</div><div class="v">'+E(x.barrier)+'</div></div>'
 +'<div class="vf pa"><div class="k">боль</div><div class="v">'+E(x.pain)+'</div></div>'
 +'<div class="vf in"><div class="k">что ищет</div><div class="v">'+E(x.info)+'</div></div>'
 +'<div class="vf an"><div class="k">о чём статья</div><div class="v">'+E(x.angle)+'</div></div>'
 +'<div class="vf tl"><div class="k">хвост</div><div class="v">'+E(x.tail)+'</div></div>';}
Object.keys(ALL).forEach(function(n){
 var B=ALL[n];
 var g=document.querySelector('[data-l="'+n+'"]');
 if(g) g.innerHTML=B.leaves.map(function(x){
  return '<div class="c s'+x.stage_num+'"><div class="h2c"><span class="sg s'+x.stage_num+'">'+E(x.stage)+'</span>'
  +'<span class="mt2">'+E(x.role)+' · '+E(x.cnt)+' зап.</span></div>'
  +'<div class="bd"><div class="ph">'+E(x.phrase)+'</div>'
  +'<div class="st">состояние человека: '+E(x.stage_state)+'</div>'+rows(x)+'</div></div>';}).join('');
 var p=B.mid.concat([B.trunk]); var v=document.querySelector('[data-p="'+n+'"]');
 if(!v) return; var h='';
 var lf=B.leaves[0];
 if(lf&&lf.link) h+='<div class="lk first"><b>переход:</b> '+E(lf.link)+' → '+E(lf.link_to)+'</div>';
 p.forEach(function(x,i){
  h+='<div class="vn'+(x.tag=='trunk'?' t':'')+'" style="border-left-color:'+(x.tag=='trunk'?'#d4a017':'#2f8f5b')+'">'
   +'<div class="vh"><span class="sg s'+x.stage_num+'">'+E(x.stage)+'</span>'
   +'<span class="mt2">'+E(x.role)+' · '+E(x.cnt)+' зап.</span></div>'
   +'<div class="ph">'+E(x.phrase)+'</div>'
   +'<div class="st">состояние человека: '+E(x.stage_state)+'</div>'+rows(x);
  if(x.tag=='trunk') h+='<div class="two"><div class="fk"><b>Гайд</b><span>делаю сам</span></div>'
   +'<div class="fk r"><b>Сопровождение</b><span>риелтор ведёт сделку</span></div></div>';
  h+='</div>';
  h+='<div class="lk"><b>переход:</b> '+E(x.link)+' → '+E(x.link_to)+'</div>';
 });
 v.innerHTML=h;
});
</script>
